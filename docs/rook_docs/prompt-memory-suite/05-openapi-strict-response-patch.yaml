# Patch fragment to make response data strongly typed per endpoint.
components:
  schemas:
    EnvelopeBase:
      type: object
      required: [ok, request_id]
      properties:
        ok: { type: boolean }
        request_id: { type: string }
        error: { $ref: '#/components/schemas/ErrorObject' }

    ErrorObject:
      type: object
      nullable: true
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true

    UpsertPromptData:
      type: object
      properties:
        prompt: { type: object }
        dedupe: { type: object }

    UpsertPromptResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            ok: { const: true }
            data: { $ref: '#/components/schemas/UpsertPromptData' }
            error: { nullable: true }

    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            ok: { const: false }
            data: { type: 'null' }
            error: { $ref: '#/components/schemas/ErrorObject' }
