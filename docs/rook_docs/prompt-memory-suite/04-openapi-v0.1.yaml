openapi: 3.1.0
info:
  title: Rook Prompt Memory Graph API
  version: "0.1.0"
servers:
  - url: /prompt-memory
paths:
  /prompts/upsert:
    post:
      operationId: upsertPrompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPromptRequest'
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertPromptResponse'
  /prompts/{prompt_id}/use:
    post:
      operationId: recordPromptUse
      parameters:
        - in: path
          name: prompt_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordUseRequest'
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordUseResponse'
  /prompts/{prompt_id}/outcomes:
    post:
      operationId: recordPromptOutcome
      parameters:
        - in: path
          name: prompt_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordOutcomeRequest'
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordOutcomeResponse'
  /prompts/recent:
    get:
      operationId: getRecentPrompts
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPromptsResponse'
  /prompts/frequent:
    get:
      operationId: getFrequentPrompts
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPromptsResponse'
  /prompts/search:
    post:
      operationId: searchPrompts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchPromptsRequest'
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPromptsResponse'
components:
  schemas:
    UpsertPromptRequest: { type: object }
    UpsertPromptResponse: { type: object }
    RecordUseRequest: { type: object }
    RecordUseResponse: { type: object }
    RecordOutcomeRequest: { type: object }
    RecordOutcomeResponse: { type: object }
    SearchPromptsRequest: { type: object }
    SearchPromptsResponse: { type: object }
    ListPromptsResponse: { type: object }
