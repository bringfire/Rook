<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rook Chat</title>
    <link rel="stylesheet" href="chat.css">
    <!-- Vendored libraries (no remote fetches) -->
    <script src="vendor/marked.min.js"></script>
    <link rel="stylesheet" href="vendor/github-dark.min.css" id="hljs-theme">
    <script src="vendor/highlight.min.js"></script>
    <script src="composer-images.js"></script>
</head>
<body>
    <div id="chat-container">
        <div id="messages"></div>
        <div id="typing-indicator" class="hidden">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>
    </div>
    <div id="composer" class="composer hidden" aria-label="Message composer">
        <div id="attachment-list" class="attachment-list"></div>
        <textarea id="composer-text" rows="3" placeholder="Message Prime"></textarea>
        <div class="composer-actions">
            <label class="icon-button" title="Attach images" aria-label="Attach images">
                +
                <input id="composer-files" type="file" accept="image/png,image/jpeg,image/webp" multiple>
            </label>
            <button id="composer-send" type="button">Send</button>
        </div>
    </div>

    <script>
        // ═══ Theme detection ═══
        function detectTheme() {
            var isDark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.body.classList.toggle('light-theme', !isDark);
            var hljsTheme = document.getElementById('hljs-theme');
            if (hljsTheme) {
                hljsTheme.href = isDark
                    ? 'vendor/github-dark.min.css'
                    : 'vendor/github.min.css';
            }
        }
        detectTheme();
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', detectTheme);
        }

        // ═══ Marked.js config ═══
        try {
            if (typeof marked !== 'undefined') {
                marked.setOptions({
                    highlight: function(code, lang) {
                        if (typeof hljs !== 'undefined') {
                            if (lang && hljs.getLanguage(lang)) {
                                try { return hljs.highlight(code, { language: lang }).value; } catch (e) {}
                            }
                            return hljs.highlightAuto(code).value;
                        }
                        return code;
                    },
                    breaks: true,
                    gfm: true
                });
            }
        } catch (e) {}

        // ═══ State ═══
        var messagesContainer = document.getElementById('messages');
        var typingIndicator = document.getElementById('typing-indicator');
        var agentColor = '#3b82f6';
        var agentInitial = 'P';
        var _conversationId = null;
        var _serviceHost = '127.0.0.1';
        var _servicePort = null;
        var _toolCardCounter = 0;
        var _composerImages = [];
        var _composerImageError = null;
        var _composerImageLoading = false;
        var _composerVisible = true;
        var _composerEnabled = true;
        var _composerAckPending = false;
        var _composerAckUnconfirmed = false;
        var _composerTextRevision = 0;
        var _composerImageRevision = 0;
        var _composerImageController = window.RookComposerImages.createSelectionController({
            maxImages: 8,
            publish: function(images) {
                _composerImages = images;
                _composerImageError = null;
                renderAttachments();
            },
            reportError: function(message) {
                _composerImageError = message;
                renderAttachments();
            },
            onLoadingChanged: function(loading) {
                _composerImageLoading = loading;
                applyComposerState();
            }
        });

        // ═══ Conversation context (for fetch bridge) ═══
        function setConversation(convId, host, port) {
            _conversationId = convId;
            _serviceHost = host || '127.0.0.1';
            _servicePort = port;
        }

        function setComposerEnabled(visible, enabled) {
            _composerVisible = visible;
            _composerEnabled = enabled;
            applyComposerState();
        }

        function applyComposerState() {
            var composer = document.getElementById('composer');
            var text = document.getElementById('composer-text');
            var send = document.getElementById('composer-send');
            var files = document.getElementById('composer-files');
            if (!composer || !text || !send) return;
            var enabled = _composerEnabled && !_composerAckPending && !_composerAckUnconfirmed;
            composer.classList.toggle('hidden', !_composerVisible);
            text.disabled = !enabled;
            send.disabled = !enabled || _composerImageLoading;
            if (files) files.disabled = !enabled || _composerImageLoading;
        }

        function renderAttachments() {
            var list = document.getElementById('attachment-list');
            if (!list) return;
            list.innerHTML = '';
            if (_composerImageError) {
                list.textContent = _composerImageError;
                return;
            }
            _composerImages.forEach(function(image) {
                var chip = document.createElement('span');
                chip.className = 'attachment-chip';
                chip.textContent = image.fileName;
                list.appendChild(chip);
            });
        }

        function readComposerFiles(files) {
            _composerImageRevision += 1;
            return _composerImageController.replace(files);
        }

        function submitComposer() {
            if (!_composerEnabled || _composerAckPending || _composerAckUnconfirmed) return;
            var textArea = document.getElementById('composer-text');
            var submittedText = textArea ? textArea.value : '';
            var text = submittedText.trim();
            if (!window.RookComposerImages.canSubmit(text, _composerImages, _composerImageLoading)) return;
            var submission = {
                type: 'submit',
                text: text,
                images: _composerImages.map(function(image) {
                    return {
                        fileName: image.fileName,
                        mimeType: image.mimeType,
                        base64Data: image.base64Data
                    };
                })
            };
            if (!window.rookBridge || typeof window.rookBridge.invoke !== 'function') return;
            var textRevision = _composerTextRevision;
            var imageRevision = _composerImageRevision;
            _composerAckPending = true;
            applyComposerState();
            function unconfirmedAcknowledgement() {
                _composerAckPending = false;
                _composerAckUnconfirmed = true;
                applyComposerState();
                addMessage('error', 'Submission acknowledgement is unconfirmed. Another request is blocked because the previous one may still be running.');
            }
            try {
                var result = window.rookBridge.invoke('submit', submission);
                if (!result || typeof result.then !== 'function') {
                    unconfirmedAcknowledgement();
                    return;
                }
                Promise.resolve(result).then(function(reply) {
                    if (!reply || typeof reply.accepted !== 'boolean' || Object.keys(reply).length !== 1) {
                        unconfirmedAcknowledgement();
                        return;
                    }
                    _composerAckPending = false;
                    // Acceptance is not model success. Clear only the submitted draft parts.
                    if (reply.accepted) {
                        if (textArea && _composerTextRevision === textRevision && textArea.value === submittedText)
                            textArea.value = '';
                        if (_composerImageRevision === imageRevision) _composerImageController.clear();
                    }
                    applyComposerState();
                }).catch(unconfirmedAcknowledgement);
            } catch (e) { unconfirmedAcknowledgement(); }
        }

        document.getElementById('composer-text').addEventListener('input', function() {
            _composerTextRevision += 1;
        });
        document.getElementById('composer-files').addEventListener('change', function(event) {
            readComposerFiles(event.target.files);
            event.target.value = '';
        });
        document.getElementById('composer-text').addEventListener('paste', function(event) {
            var files = window.RookComposerImages.clipboardImageFiles(
                (event.clipboardData && event.clipboardData.items) || []);
            if (files.length === 0) return;
            event.preventDefault();
            readComposerFiles(files);
        });
        document.getElementById('composer-send').addEventListener('click', submitComposer);
        document.getElementById('composer-text').addEventListener('keydown', function(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                submitComposer();
            }
        });

        // ═══ Markdown rendering ═══
        function renderMarkdown(text) {
            if (typeof marked !== 'undefined') {
                try { return marked.parse(text); } catch (e) {}
            }
            var escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            return escaped.replace(/\n/g, '<br>');
        }

        // ═══ Add message ═══
        function addMessage(role, content, isStreaming) {
            isStreaming = isStreaming || false;

            var messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + role + '-message';

            if (role === 'assistant') {
                messageDiv.innerHTML = renderMarkdown(content);
                addCopyButtons(messageDiv);
            } else if (role === 'agent') {
                messageDiv.className = 'message assistant-message agent-message';
                messageDiv.style.setProperty('--accent-color', agentColor);
                var avatar = '<span class="agent-avatar" style="background-color:' + agentColor + '">' + agentInitial + '</span>';
                var rendered = renderMarkdown(content);
                messageDiv.innerHTML = avatar + '<span class="agent-content">' + rendered + '</span>';
                addCopyButtons(messageDiv);
            } else if (role === 'user') {
                messageDiv.textContent = content;
            } else if (role === 'tool') {
                messageDiv.className = 'message tool-message';
                messageDiv.innerHTML = '<div class="tool-header">Tool: ' + escapeHtml(content.name) + '</div><pre>' + escapeHtml(JSON.stringify(content.result, null, 2)) + '</pre>';
            } else if (role === 'error') {
                messageDiv.className = 'message error-message';
                messageDiv.textContent = content;
            } else if (role === 'system') {
                messageDiv.className = 'message system-message';
                messageDiv.textContent = content;
            }

            if (isStreaming) {
                messageDiv.id = 'streaming-message';
            }

            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
            return messageDiv;
        }

        // ═══ Streaming ═══
        function updateStreamingMessage(content) {
            var messageDiv = document.getElementById('streaming-message');
            if (!messageDiv) {
                messageDiv = addMessage('assistant', content, true);
            } else {
                messageDiv.innerHTML = renderMarkdown(content);
                addCopyButtons(messageDiv);
            }
            scrollToBottom();
        }

        function finalizeStreamingMessage() {
            var messageDiv = document.getElementById('streaming-message');
            if (messageDiv) {
                messageDiv.removeAttribute('id');
            }
        }

        // ═══ Copy buttons ═══
        function addCopyButtons(container) {
            var codeBlocks = container.querySelectorAll('pre code');
            codeBlocks.forEach(function(block) {
                var pre = block.parentElement;
                if (!pre.querySelector('.copy-button')) {
                    var button = document.createElement('button');
                    button.className = 'copy-button';
                    button.textContent = 'Copy';
                    button.onclick = function() {
                        navigator.clipboard.writeText(block.textContent);
                        button.textContent = 'Copied!';
                        setTimeout(function() { button.textContent = 'Copy'; }, 2000);
                    };
                    pre.style.position = 'relative';
                    pre.appendChild(button);
                }
            });
        }

        // ═══ Typing indicator ═══
        function showTypingIndicator(show) {
            typingIndicator.classList.toggle('hidden', !show);
            if (show) scrollToBottom();
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function clearMessages() {
            messagesContainer.innerHTML = '';
            _toolCardCounter = 0;
        }

        // ═══ Images ═══
        function addImage(base64Data, altText) {
            altText = altText || 'Viewport capture';
            var messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant-message image-message';
            var img = document.createElement('img');
            img.src = 'data:image/png;base64,' + base64Data;
            img.alt = altText;
            img.className = 'chat-image';
            img.onclick = function() {
                var win = window.open();
                win.document.write('<img src="' + img.src + '" style="max-width:100%">');
            };
            messageDiv.appendChild(img);
            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // ═══ Theme ═══
        function setTheme(isDark) {
            document.body.classList.toggle('light-theme', !isDark);
            var hljsTheme = document.getElementById('hljs-theme');
            if (hljsTheme) {
                hljsTheme.href = isDark
                    ? 'vendor/github-dark.min.css'
                    : 'vendor/github.min.css';
            }
        }


        // ═══════════════════════════════════════════════════════════
        // TOOL CARDS (Phase 2)
        // ═══════════════════════════════════════════════════════════

        function formatToolValue(value) {
            var text = '';
            if (value === null || value === undefined) {
                text = 'null';
            } else if (typeof value === 'string') {
                text = value;
            } else if (typeof value === 'number' || typeof value === 'boolean') {
                text = String(value);
            } else {
                try {
                    text = JSON.stringify(value);
                } catch (e) {
                    text = String(value);
                }
            }
            if (text.length > 80) text = text.substring(0, 77) + '...';
            return text;
        }

        function renderToolCard(toolName, params, toolCallId) {
            // Finalize any in-progress streaming message first
            finalizeStreamingMessage();

            _toolCardCounter++;
            var cardId = 'tool-card-' + _toolCardCounter;

            var paramsText = '';
            if (params && typeof params === 'object') {
                var keys = Object.keys(params);
                var parts = [];
                for (var i = 0; i < Math.min(keys.length, 3); i++) {
                    var key = keys[i];
                    var formattedValue = formatToolValue(params[key]);
                    parts.push(key + ': ' + formattedValue);
                }
                paramsText = parts.join(', ');
                if (keys.length > 3) paramsText += ' ...';
            }

            var card = document.createElement('div');
            card.className = 'tool-card';
            card.id = cardId;
            card.setAttribute('data-state', 'executing');
            card.setAttribute('data-tool', toolName);
            if (toolCallId) card.setAttribute('data-tool-call-id', toolCallId);
            card.innerHTML =
                '<div class="tool-card-header">' +
                    '<div class="tool-card-icon"><div class="tool-card-spinner"></div></div>' +
                    '<span class="tool-card-name">' + escapeHtml(toolName) + '</span>' +
                '</div>' +
                (paramsText ? '<div class="tool-card-params">' + escapeHtml(paramsText) + '</div>' : '') +
                '<div class="tool-card-result hidden"></div>';

            messagesContainer.appendChild(card);
            scrollToBottom();
            return cardId;
        }

        function finalizeToolCard(toolCallId, verified, verificationNote, summary, toolStatus) {
            // Match by unique tool_call_id for precise card targeting
            var card = null;
            if (toolCallId) {
                card = messagesContainer.querySelector('.tool-card[data-tool-call-id="' + toolCallId + '"]');
            }
            // Fallback: last executing card (backward compatibility)
            if (!card) {
                var cards = messagesContainer.querySelectorAll('.tool-card[data-state="executing"]');
                card = cards.length > 0 ? cards[cards.length - 1] : null;
            }
            if (!card) return;

            var state, badgeClass, badgeIcon;
            // data-state="failed" is used for application-level tool failures.
            if (toolStatus === 'failed') {
                state = 'failed';
                badgeClass = 'failed';
                badgeIcon = '!';
            } else if (toolStatus === 'warning') {
                state = 'done-unverified';
                badgeClass = 'unverified';
                badgeIcon = '!';
            } else if (verified === true) {
                state = 'done-verified';
                badgeClass = 'verified';
                badgeIcon = '\u2713';
            } else if (verified === false) {
                state = 'done-unverified';
                badgeClass = 'unverified';
                badgeIcon = '!';
            } else if (toolStatus === 'success') {
                state = 'done-success';
                badgeClass = 'success';
                badgeIcon = '\u2713';
            } else {
                // No verification info — treat as neutral done
                state = 'done-unverified';
                badgeClass = 'unverified';
                badgeIcon = '\u00b7';
            }

            card.setAttribute('data-state', state);

            var resultDiv = card.querySelector('.tool-card-result');
            if (resultDiv && summary) {
                resultDiv.classList.remove('hidden');
                resultDiv.innerHTML =
                    '<div class="verification-badge ' + badgeClass + '">' + badgeIcon + '</div>' +
                    '<span class="tool-card-summary">' + escapeHtml(summary) + '</span>';
            }
        }


        // ═══ Utility ═══
        function escapeHtml(text) {
            if (typeof text !== 'string') text = String(text);
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // ═══ Public API ═══
        window.chatAPI = {
            // ── Existing (preserved) ──
            addMessage: addMessage,
            updateStreamingMessage: updateStreamingMessage,
            finalizeStreamingMessage: finalizeStreamingMessage,
            showTypingIndicator: showTypingIndicator,
            clearMessages: clearMessages,
            addImage: addImage,
            setTheme: setTheme,
            scrollToBottom: scrollToBottom,
            // ── New: Phase 1 ──
            setConversation: setConversation,
            setComposerEnabled: setComposerEnabled,
            // ── New: Phase 2 — Tool cards ──
            renderToolCard: renderToolCard,
            finalizeToolCard: finalizeToolCard,
        };

        // Signal readiness
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage({ type: 'ready' });
        }
    </script>
</body>
</html>
