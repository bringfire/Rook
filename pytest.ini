[pytest]
# Blessed non-live regression gate (run from the repo root):
#     python -m pytest mcp_server/tests -m "not requires_rhino"
# It collects cleanly with NO --ignore flags. Live-Rhino tests carry the
# markers below and are deselected by the gate. Legacy/manual scripts are
# named manual_*.py (NOT test_*.py) so pytest does not collect them — they
# run live Rhino code and/or sys.exit at import; run them directly instead.
# See mcp_server/tests/manual_*.py.
testpaths =
    mcp_server/tests
markers =
    requires_rhino: integration test that requires a live Rhino session with the plugin loaded
    command_control_live: live command-control worker-saturation tests for an owned Rhino runtime
    runscript_safety_live: live RunScript safety smoke tests for an owned Rhino runtime
    runscript_safety_hooks: RunScript safety smoke tests that require native test hooks at Rhino launch
