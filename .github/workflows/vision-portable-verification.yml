name: Vision portable verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vision-portable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Windows Vision contracts and FFmpeg policy
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install existing Python project and test dependencies
        run: python -m pip install -e './mcp_server[test]'
      - name: Run portable checks without Rhino or provider access
        shell: pwsh
        run: ./scripts/verify-vision-merge.ps1 -PortableOnly
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vision-portable-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/vision-merge-verification/
          if-no-files-found: error
          retention-days: 14
