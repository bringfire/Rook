name: Legacy Build and Release Disabled

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.5.0)'
        required: true
        default: 'v1.1.0'

jobs:
  disabled:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Stop legacy release path
      shell: pwsh
      run: |
        throw "This ZIP-based release workflow is retired. Use the local build-release Inno Setup pipeline, which runs scripts\validate-ffmpeg-bundle.ps1 and packages the vetted LGPL FFmpeg payload."
