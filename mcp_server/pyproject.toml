[project]
name = "rook-mcp"
version = "1.6.0"
description = "MCP server for Claude AI to interact with Rhino 3D"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "agent-client-protocol==0.12.1",
    "mcp==1.28.1",
    "httpx>=0.25.0",
    "mabwiser>=2.7.0",
    "dspy>=2.6.0",
    "python-dotenv>=1.0.0",
    "litellm==1.89.4",
    "google-auth==2.56.3",
    "aiohttp>=3.9.0",
    "networkx>=3.2",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
    "jsonschema-specifications==2025.9.1",
    "packaging==26.2",
    # Vision/Image Processing libraries
    "opencv-python>=4.8.0",
    "scikit-image>=0.22.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "anyio",
]

[project.scripts]
rook-mcp = "rook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rook"]
