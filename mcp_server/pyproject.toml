[project]
name = "rook-mcp"
version = "1.5.12"
description = "MCP server for Claude AI to interact with Rhino 3D"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
    "mabwiser>=2.7.0",
    "dspy>=2.6.0",
    "python-dotenv>=1.0.0",
    "litellm>=1.0.0,!=1.82.7,!=1.82.8",
    "aiohttp>=3.9.0",
    "networkx>=3.2",
    # Vision/Image Processing libraries
    "opencv-python>=4.8.0",
    "scikit-image>=0.22.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "anyio",
]

[project.scripts]
rook-mcp = "rook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rook"]
